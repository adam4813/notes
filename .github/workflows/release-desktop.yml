name: Release Desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installers:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            package_command: npm run package:desktop:win
          - platform: macos
            os: macos-latest
            package_command: npm run package:desktop:mac
          - platform: linux
            os: ubuntu-latest
            package_command: npm run package:desktop:linux

    env:
      # Keep unsigned CI builds straightforward.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: ${{ matrix.package_command }}

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          if (Test-Path "dist-desktop") {
            Get-ChildItem "dist-desktop" -File | Where-Object {
              $_.Extension -in @(".exe", ".dmg", ".AppImage", ".blockmap")
            } | ForEach-Object {
              Copy-Item $_.FullName -Destination "release-artifacts"
            }
          }
          Get-ChildItem "release-artifacts" -File | Select-Object Name, Length

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-installers

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Show release files
        run: ls -lah release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-build-${{ github.run_id }}
          name: Main build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
