name: Release Desktop

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installers:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            package_script: package:win
          - platform: macos
            os: macos-latest
            package_script: package:mac
          - platform: linux
            os: ubuntu-latest
            package_script: package:linux

    env:
      # Keep unsigned CI builds straightforward.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundles
        run: npm run build:desktop

      - name: Package installer (no publish in matrix build)
        run: npm --workspace @notes/desktop run ${{ matrix.package_script }} -- --publish=never

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          if (Test-Path "dist-desktop") {
            Get-ChildItem "dist-desktop" -File | ForEach-Object {
              Copy-Item $_.FullName -Destination "release-artifacts"
            }
          }
          Get-ChildItem "release-artifacts" -File | Select-Object Name, Length

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-installers

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Show release files
        run: ls -lah release-artifacts

      - name: Extract Version from package.json
        id: get_version
        run: |
          # Reads the version field and removes the quotes
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_TAG=v$VERSION" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
