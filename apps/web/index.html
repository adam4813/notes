<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <script>
      // Set theme + accent before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var mode = localStorage.getItem("notes.theme") || "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.dataset.theme = resolved;
          var accent = localStorage.getItem("notes.accent");
          if (accent) {
            document.documentElement.style.setProperty("--accent", accent);
          }
          var appFont = localStorage.getItem("notes.font.app");
          if (appFont) {
            document.documentElement.style.setProperty("--app-font-size", appFont + "px");
          }
          var editorFont = localStorage.getItem("notes.font.editor");
          if (editorFont) {
            document.documentElement.style.setProperty("--editor-font-size", editorFont + "px");
          }
        } catch (error) {
          /* ignore storage access errors */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
