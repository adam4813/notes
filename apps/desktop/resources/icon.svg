<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#7c3aed"/>
  <!-- Notebook pages stacked -->
  <rect x="136" y="164" width="240" height="300" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="128" y="152" width="240" height="300" rx="12" fill="rgba(255,255,255,0.25)"/>
  <!-- Main page -->
  <rect x="120" y="140" width="240" height="300" rx="12" fill="white"/>
  <!-- Ruled lines -->
  <line x1="152" y1="196" x2="328" y2="196" stroke="#e2e2e6" stroke-width="2"/>
  <line x1="152" y1="224" x2="328" y2="224" stroke="#e2e2e6" stroke-width="2"/>
  <line x1="152" y1="252" x2="328" y2="252" stroke="#e2e2e6" stroke-width="2"/>
  <line x1="152" y1="280" x2="280" y2="280" stroke="#e2e2e6" stroke-width="2"/>
  <!-- Accent line -->
  <line x1="152" y1="168" x2="248" y2="168" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
</svg>
