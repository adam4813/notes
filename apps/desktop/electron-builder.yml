appId: com.notes.app
productName: Notes
copyright: "Copyright © 2026"

# asar disabled for MVP to avoid native-module path complexity
asar: false

# Run npm rebuild to restore local Node.js native modules
afterPack: ./scripts/afterPack.js

directories:
  buildResources: resources
  output: ../../dist-desktop

# All paths relative to apps/desktop/ (electron-builder runs as workspace)
files:
  - dist-electron/**
  - dist-server/**
  - "!dist-server/main.js.map"
  - "!dist-electron/*.map"

extraResources:
  - from: ../web/dist
    to: web/dist

win:
  target: nsis
  icon: resources/icon.ico
  artifactName: "Notes-Setup-${version}.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: "Notes-${version}.dmg"

linux:
  target: AppImage
  icon: resources/icon.png
  artifactName: "Notes-${version}.AppImage"
  category: Office
  executableName: notes
  syncDesktopName: true

publish:
  provider: github
  owner: adam4813
  repo: notes
  releaseType: release
