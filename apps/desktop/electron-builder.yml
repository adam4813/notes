appId: com.notes.app
productName: Notes
copyright: "Copyright © 2026"

# asar disabled for MVP to avoid native-module path complexity
asar: false

directories:
  buildResources: resources
  output: ../../dist-desktop

# All paths relative to apps/desktop/ (electron-builder runs as workspace)
files:
  - dist-electron/**
  - dist-server/**
  - "!dist-server/main.js.map"
  - "!dist-electron/*.map"

extraResources:
  - from: ../web/dist
    to: web/dist
  # Native modules pre-built for Electron ABI (see scripts/prebuild-native.mjs).
  # Run `npm run prebuild-native` before packaging to regenerate.
  - from: native-staging/better-sqlite3
    to: node_modules/better-sqlite3
    filter:
      - "**"
      - "!**/*.md"
      - "!**/test/**"
      - "!**/build/deps/**"
  - from: native-staging/bindings
    to: node_modules/bindings
  - from: native-staging/file-uri-to-path
    to: node_modules/file-uri-to-path

win:
  target: nsis
  icon: resources/icon.ico
  artifactName: "Notes-Setup-${version}.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target: dmg
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: "Notes-${version}.dmg"

linux:
  target: AppImage
  icon: resources/icon.png
  artifactName: "Notes-${version}.AppImage"
  category: Office
  executableName: notes
  syncDesktopName: true

# Uncomment and configure when setting up CI/CD releases:
# publish:
#   provider: github
#   releaseType: draft
